site_name: Arcoon Deck
site_description: Arcoon Deck — a modification of Tender: a Decky Loader plugin that syncs your self-hosted RomM library into Steam
site_url: https://manu0623.github.io/arcoon-deck/
copyright: >-
  Arcoon Deck — a modification of <a href="https://github.com/danielcopper/romm-tender">Tender</a> by
  <a href="https://github.com/danielcopper">Daniel Copper</a>, distributed under the GPL-3.0.

# Architectural Decision Records (`docs/adr/`) are kept in the repo for
# contributors and AI agents — they're internal design history, not user
# documentation. Exclude them from the published MkDocs site so they
# don't appear as orphan pages or in on-site search.
exclude_docs: |
  adr/

repo_url: https://github.com/manu0623/arcoon-deck
repo_name: manu0623/arcoon-deck
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Origin &amp; Attribution: attribution.md
  - User Guide:
      - Getting Started: user-guide/getting-started.md
      - Configuration: user-guide/configuration.md
      - Syncing Your Library: user-guide/syncing-your-library.md
      - Managing Games: user-guide/managing-games.md
      - BIOS &amp; Emulator Cores: user-guide/bios-management.md
      - Save Sync: user-guide/save-sync.md
      - Save File Extensions: user-guide/save-file-extensions.md
      - Save Sync Support Matrix: user-guide/save-sync-support-matrix.md
      - RetroDECK Path Migration: user-guide/retrodeck-path-migration.md
      - Where Your Data Lives: user-guide/where-your-data-lives.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Architecture:
      - Backend Architecture: architecture/backend-architecture.md
      - Database Design: architecture/database-design.md
      - Save File Sync Architecture: architecture/save-file-sync-architecture.md
      - Save Sync Coverage: architecture/save-sync-coverage.md
      - Save Structure (measured): architecture/save-structure.md
      - Removed-Game Cleanup: architecture/removed-game-cleanup.md
      - Config Source Parsers: architecture/config-source-parsers.md
      - Core &amp; Emulator Selection: architecture/core-emulator-selection.md
      - The Two-Layer Launcher: architecture/two-layer-launcher.md
      - The Launch Layer: architecture/launch-layer.md
      - Steam Non-Steam Shortcuts: architecture/steam-non-steam-shortcuts.md
      - QAM Panel: architecture/qam-panel.md
      - Steam Remote Play & Cross-Device: architecture/steam-remote-play.md
  - Contributing:
      - Development: contributing/development.md
      - Frontend dev loop: contributing/frontend-dev-loop.md
      - Dependency management: contributing/dependency-management.md
